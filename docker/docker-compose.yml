# Two lab targets for wadoscope. BOTH are intentionally insecure test rigs —
# local use only, never expose to a network you don't control.
#
#   orthanc-open  :8042  — NO authentication  (unauth-access testing)
#   orthanc-auth  :8043  — HTTP Basic auth ON (unauth-vs-auth contrast; creds alice:alicepass)
services:
  orthanc-open:
    image: jodogne/orthanc-plugins:1.12.4
    ports:
      - "8042:8042"   # HTTP + DICOMweb  -> http://localhost:8042/dicom-web
      - "4242:4242"   # classic DIMSE
    volumes:
      - ./orthanc.json:/etc/orthanc/orthanc.json:ro
    restart: unless-stopped

  orthanc-auth:
    image: jodogne/orthanc-plugins:1.12.4
    ports:
      - "8043:8042"   # HTTP + DICOMweb  -> http://localhost:8043/dicom-web  (needs alice:alicepass)
      - "4243:4242"
    volumes:
      - ./orthanc-auth.json:/etc/orthanc/orthanc.json:ro
    restart: unless-stopped
